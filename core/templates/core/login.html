<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Welcome Back</title>
    {% load static %}
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: #0c0d0e;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Ambient Room Glow */
        .room-light {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: radial-gradient(circle at 30% 50%, rgba(255, 215, 0, 0.05) 0%, transparent 60%);
            pointer-events: none;
        }

        .login-wrapper {
            display: flex;
            width: 950px;
            max-width: 92%;
            height: 550px;
            background: #141619;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
            overflow: hidden;
            position: relative;
            z-index: 10;
        }

        /* PNG Artwork Panel Side */
        .artwork-section {
            flex: 1;
            background: #0d0e11;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }

        .artwork-image {
            width: 116%;
            height: auto;
            max-width: cover;
            object-fit: contain;
        }

        /* Form Side */
        .form-section {
            flex: 1.1;
            padding: 40px 45px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #141619;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: #7a7f8d;
            font-size: 13px;
            text-decoration: none;
            margin-bottom: 20px;
            transition: color 0.2s ease, transform 0.2s ease;
            width: fit-content;
        }

        .back-link:hover {
            color: #ffd700;
            transform: translateX(-3px);
        }

        .form-header h2 {
            color: #ffffff;
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .form-header p {
            color: #7a7f8d;
            font-size: 14px;
            margin-bottom: 24px;
        }

        .input-group-custom {
            position: relative;
            margin-bottom: 18px;
        }

        .input-group-custom i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #5d6370;
            font-size: 15px;
        }

        .lamp-input {
            width: 100%;
            padding: 14px 16px 14px 45px;
            background: #1c1f24;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .lamp-input:focus {
            border-color: #ffd700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: #ffd700;
            border: none;
            border-radius: 12px;
            color: #0c0d0e;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.2s, background 0.2s;
        }

        .submit-btn:hover {
            background: #ffea00;
            transform: translateY(-2px);
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #4a4e5a;
            font-size: 11px;
            letter-spacing: 1px;
            margin: 22px 0;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .divider span {
            padding: 0 10px;
        }

        .social-btn-container {
            display: flex;
            gap: 12px;
        }

        .social-btn {
            flex: 1;
            padding: 10px;
            background: #1c1f24;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            color: #e1e1e1;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            text-decoration: none;
        }

        .error-message {
            color: #ff5252;
            font-size: 13px;
            margin-bottom: 15px;
        }

        @media (max-width: 768px) {
            .artwork-section {
                display: none;
            }
            .login-wrapper {
                max-width: 450px;
                height: auto;
            }
        }
    </style>
</head>
<body>
    <div class="room-light"></div>

    <div class="login-wrapper">
        <!-- PNG Artwork Panel Side -->
        <div class="artwork-section">
            <img src="{% static 'core/images/login-illustration.png' %}" alt="Developer Workspace Illustration" class="artwork-image">
        </div>

        <!-- Form Side -->
        <div class="form-section">
            <a href="{% url 'landing' %}" class="back-link">
                <i class="fa-solid fa-arrow-left"></i> Back to Landing Page
            </a>

            <div class="form-header">
                <h2>Welcome Back</h2>
                <p>Enter your details to access your account</p>
            </div>

            {% if form.errors %}
                <div class="error-message">
                    Invalid username or password. Please try again.
                </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="input-group-custom">
                    <i class="fa-regular fa-user"></i>
                    {{ form.username }}
                </div>
                <div class="input-group-custom">
                    <i class="fa-solid fa-lock"></i>
                    {{ form.password }}
                </div>

                <button type="submit" class="submit-btn">Sign In</button>
            </form>

            <div class="divider">
                <span>OR CONTINUE WITH</span>
            </div>

            <div class="social-btn-container">
                <a href="#" class="social-btn">
                    <i class="fa-brands fa-google" style="color: #ea4335;"></i> Google
                </a>
                <a href="#" class="social-btn">
                    <i class="fa-brands fa-github"></i> GitHub
                </a>
            </div>
        </div>
    </div>
</body>
</html>
