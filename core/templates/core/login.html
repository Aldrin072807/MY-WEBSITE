<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Welcome Back</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: #0c0d0e;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Room Glow Effects */
        .room-light {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: radial-gradient(circle at 30% 50%, rgba(255, 208, 0, 0.08) 0%, transparent 60%);
            pointer-events: none;
        }

        .login-wrapper {
            display: flex;
            width: 900px;
            max-width: 90%;
            height: 550px;
            background: #141619;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            border: 1px solid rgba(255, 255, 255, 0.05);
            overflow: hidden;
            position: relative;
            z-index: 10;
        }

        /* Lamp Visual Side */
        .lamp-section {
            flex: 1;
            background: #0d0e11;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .lamp-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: 40px;
        }

        .light-beam {
            position: absolute;
            top: 140px;
            width: 0;
            height: 0;
            border-left: 140px solid transparent;
            border-right: 140px solid transparent;
            border-bottom: 320px solid rgba(255, 215, 0, 0.12);
            filter: blur(10px);
            pointer-events: none;
        }

        .lamp-head {
            width: 160px;
            height: 70px;
            background: #222;
            border-radius: 80px 80px 0 0;
            position: relative;
            z-index: 2;
            box-shadow: inset 0 -5px 10px rgba(255, 215, 0, 0.3);
        }

        .lamp-head::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 100%;
            height: 10px;
            background: #ffd700;
            border-radius: 50%;
            box-shadow: 0 0 20px #ffd700;
        }

        .lamp-pole {
            width: 8px;
            height: 220px;
            background: linear-gradient(to right, #333, #555, #222);
            position: relative;
            z-index: 1;
        }

        .lamp-base {
            width: 140px;
            height: 16px;
            background: #222;
            border-radius: 10px 10px 0 0;
            z-index: 2;
        }

        /* Form Side */
        .form-section {
            flex: 1.1;
            padding: 50px 45px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #141619;
        }

        .form-header h2 {
            color: #ffffff;
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .form-header p {
            color: #7a7f8d;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .input-group-custom {
            position: relative;
            margin-bottom: 18px;
        }

        .input-group-custom i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #5d6370;
            font-size: 15px;
        }

        .lamp-input {
            width: 100%;
            padding: 14px 16px 14px 45px;
            background: #1c1f24;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .lamp-input:focus {
            border-color: #ffd700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: #ffd700;
            border: none;
            border-radius: 12px;
            color: #0c0d0e;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.2s, background 0.2s;
        }

        .submit-btn:hover {
            background: #ffea00;
            transform: translateY(-2px);
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: #4a4e5a;
            font-size: 11px;
            letter-spacing: 1px;
            margin: 25px 0;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .divider span {
            padding: 0 10px;
        }

        .social-btn-container {
            display: flex;
            gap: 12px;
        }

        .social-btn {
            flex: 1;
            padding: 10px;
            background: #1c1f24;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            color: #e1e1e1;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            text-decoration: none;
        }

        .error-message {
            color: #ff5252;
            font-size: 13px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="room-light"></div>

    <div class="login-wrapper">
        <!-- Lamp Visualization Side -->
        <div class="lamp-section">
            <div class="lamp-container">
                <div class="light-beam"></div>
                <div class="lamp-head"></div>
                <div class="lamp-pole"></div>
                <div class="lamp-base"></div>
            </div>
        </div>

        <!-- Form Side -->
        <div class="form-section">
            <div class="form-header">
                <h2>Welcome Back</h2>
                <p>Enter your details to access your account</p>
            </div>

            {% if form.errors %}
                <div class="error-message">
                    Invalid username or password. Please try again.
                </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="input-group-custom">
                    <i class="fa-regular fa-user"></i>
                    {{ form.username }}
                </div>
                <div class="input-group-custom">
                    <i class="fa-solid fa-lock"></i>
                    {{ form.password }}
                </div>

                <button type="submit" class="submit-btn">Sign In</button>
            </form>

            <div class="divider">
                <span>OR CONTINUE WITH</span>
            </div>

            <div class="social-btn-container">
                <a href="#" class="social-btn">
                    <i class="fa-brands fa-google" style="color: #ea4335;"></i> Google
                </a>
                <a href="#" class="social-btn">
                    <i class="fa-brands fa-github"></i> GitHub
                </a>
            </div>
        </div>
    </div>
</body>
</html>
